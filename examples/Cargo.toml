[package]
name = "echo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
mcp-sdk = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "echo-server"
path = "src/main.rs"
